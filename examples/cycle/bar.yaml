# Cycle mesh — separate processes (see launch.json compound "cycle mesh").
#
#   foo → bar → baz → buzz → bar
#                      ↓
#                    bizz → mid1 → mid2 → mid3 → blaz
#
# Fixed UDP ports so peers can dial without a coordinator.

identity: ../.local/cycle/bar.pem
ca: ../.local/cycle/ca.crt
cert: ../.local/cycle/bar.crt
control: ../.local/cycle/bar.sock
gateway: false
listen:
  - udp:127.0.0.1:4501
